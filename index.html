<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>📝 My Todo List</h1>

        <div class="input-box">
            <input
                type="text"
                id="taskInput"
                placeholder="Add your task..."
            >
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>

        <div class="filters">
            <button class="filter-btn active"
                onclick="filterTasks('all', this)">All</button>

            <button class="filter-btn"
                onclick="filterTasks('pending', this)">Pending</button>

            <button class="filter-btn"
                onclick="filterTasks('completed', this)">Completed</button>
        </div>

        <ul id="taskList"></ul>

        <div class="task-info">
            <span id="taskCount">0 tasks</span>

            <button class="clear-btn" onclick="clearCompleted()">
                Clear Completed
            </button>
        </div>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
